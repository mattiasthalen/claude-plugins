name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.287
      - name: Validate marketplace
        # --strict fails an empty catalog, so it applies once a plugin is listed
        run: |
          if jq -e '.plugins | length > 0' .claude-plugin/marketplace.json >/dev/null; then
            claude plugin validate --strict .
          else
            claude plugin validate .
          fi
      - name: Validate each plugin
        run: |
          for p in plugins/*/; do
            [ -f "$p.claude-plugin/plugin.json" ] || continue
            claude plugin validate --strict "$p"
          done
      - name: Unit-test the sdlc stage hook
        run: python3 -m unittest discover -s plugins/sdlc/hooks -p 'test_*.py'
      - name: Test the eval suite's shape graders and tools offline
        run: |
          python3 evals/sdlc/tools/test_shape_graders.py
          python3 evals/sdlc/tools/test_ablate.py
          python3 evals/sdlc/tools/rebuild_histories.py --check
